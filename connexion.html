<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d6b5a" />
    <title>Connexion | Mwana+</title>
    <style>
      :root{--green:#0d6b5a;--ink:#14332c;--cream:#f7faf8;--line:#d7e4df}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 system-ui,sans-serif}main{max-width:460px;margin:auto;padding:48px 20px}.brand{font-size:28px;font-weight:800;color:var(--green);text-decoration:none}.brand span{color:#ef7b45}h1{font-size:34px;line-height:1.12;margin:44px 0 14px}form{display:grid;gap:9px;margin:30px 0}input{padding:15px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit}button{border:0;border-radius:12px;padding:14px 18px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}.hint{font-size:14px;color:#63766f}#notice{min-height:24px;color:var(--green);font-weight:600}
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">Mwana<span>+</span></a>
      <h1>Votre numéro de téléphone</h1>
      <p>Nous vous enverrons un code de connexion gratuit par SMS.</p>
      <form id="phone-form"><label for="phone">Numéro camerounais</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="6 XX XX XX XX" required><button type="submit">Recevoir mon code</button></form>
      <p id="notice" role="status"></p><p class="hint">La connexion par SMS sera activée lorsque Supabase sera configuré.</p>
    </main>
    <script>
      document.getElementById('phone-form').addEventListener('submit', function (event) {
        event.preventDefault();
        document.getElementById('notice').textContent = 'Merci. Le service SMS sera bientôt disponible.';
      });
    </script>
  </body>
</html>
